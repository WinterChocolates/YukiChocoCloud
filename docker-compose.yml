services:
  app:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - uploads:/app/uploads
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-yukichoco}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-yukichoco}
      POSTGRES_DB: ${POSTGRES_DB:-yukichoco}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-yukichoco}"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
